<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <main>
      <section class="glass">
        <div class="logo-header">
         <img src="./Images/v.png" alt="University of Lagos Logo" class="form-logo">
         <h1 class="unilag-title">UNIVERSITY OF LAGOS</h1>
      </div>
        <h1>HOSTEL BALLOTING PORTAL</h1>
        <p id="login-error" style="color:#100404; font-size:0.85rem; margin-bottom:0.6rem; display:none;"></p>
        <form id="login-form">
          <input type="text" id="matric-input" placeholder="Matric Number" required />
          <input type="password" id="password-input" placeholder="Password" required />
          <button type="submit" id="login-btn">Sign In</button>
        </form>
      </section>
    </main>

    <script type="module">
      import { auth, matricToEmail } from "./firebase-config.js";
      import { signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

      const loginForm = document.getElementById('login-form');
      const loginBtn = document.getElementById('login-btn');
      const errorBox = document.getElementById('login-error');

      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.style.display = 'none';

        const matric = document.getElementById('matric-input').value;
        const password = document.getElementById('password-input').value;
        const email = matricToEmail(matric);

        loginBtn.disabled = true;
        loginBtn.textContent = 'Signing In...';

        try {
          await signInWithEmailAndPassword(auth, email, password);
          window.location.href = 'homepage.html';
        } catch (err) {
          errorBox.textContent = 'Login failed: invalid matric number or password.';
          errorBox.style.display = 'block';
          loginBtn.disabled = false;
          loginBtn.textContent = 'Sign In';
        }
      });
    </script>
  </body>
</html>
