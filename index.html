<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <main>
      <section class="glass">
        <div class="logo-header">
         <img src="./Images/v.png" alt="University of Lagos Logo" class="form-logo">
         <h1 class="unilag-title">UNIVERSITY OF LAGOS</h1>
      </div>
        <h1>HOSTEL BALLOTING PORTAL</h1>
        <p id="login-error" role="alert" style="color:#100404; font-size:0.85rem; margin-bottom:0.6rem; display:none;"></p>
        <form id="login-form">
          <input type="text" id="matric-input" placeholder="Matric Number" autocomplete="username" required />
          <input type="password" id="password-input" placeholder="Password" autocomplete="current-password" required />
          <button type="submit" id="login-btn">Sign In</button>
        </form>
      </section>
    </main>

    <!-- Classic script: defines window.FIREBASE_CONFIG, window.matricToEmail
         and window.describeFirebaseError. Loads from file:// as well as http(s)://. -->
    <script src="./firebase-config.js"></script>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
      import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-auth.js";

      const loginForm = document.getElementById('login-form');
      const loginBtn = document.getElementById('login-btn');
      const errorBox = document.getElementById('login-error');

      function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = 'block';
      }

      function resetButton() {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Sign In';
      }

      if (!window.FIREBASE_CONFIG) {
        showError('Could not load firebase-config.js. Make sure it sits in the same folder as index.html.');
      } else {
        const auth = getAuth(initializeApp(window.FIREBASE_CONFIG));

        loginForm.addEventListener('submit', async (event) => {
          event.preventDefault();
          errorBox.style.display = 'none';

          const matric = document.getElementById('matric-input').value;
          const password = document.getElementById('password-input').value;

          loginBtn.disabled = true;
          loginBtn.textContent = 'Signing In...';

          try {
            await signInWithEmailAndPassword(auth, window.matricToEmail(matric), password);
            window.location.href = 'homepage.html';
          } catch (err) {
            // Report what actually went wrong instead of blaming the password.
            console.error('Sign-in failed:', err);
            showError(window.describeFirebaseError(err));
            resetButton();
          }
        });
      }
    </script>
  </body>
</html>
